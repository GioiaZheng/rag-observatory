name: Feature proposal
description: Propose a focused addition to RAG trace inspection, evaluation, or reporting.
title: "[proposal] "
body:
  - type: markdown
    attributes:
      value: |
        This repository is a diagnostic layer around RAG experiments, not a
        general pipeline or application framework.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which concrete diagnosis or evaluation task is currently difficult?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest interface, report, adapter, or fixture that would help.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or example
      description: Link a public specification, issue, fixture, or minimal example when possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Could this be handled by existing trace fields, reports, or external tooling?
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Scope check
      options:
        - label: The proposal concerns RAG observability, diagnosis, evaluation, or trace ingestion.
          required: true
        - label: Any example data can be public, synthetic, or fully sanitized.
          required: true
