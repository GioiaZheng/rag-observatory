name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -e ".[dev]"

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run mypy
        run: mypy src

      - name: Run tests
        run: python -m unittest discover -s tests

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --tag rag-observatory:test .

      - name: Run tests in Docker image
        run: docker run --rm rag-observatory:test

      - name: Run CLI smoke test in Docker image
        run: >
          docker run --rm rag-observatory:test
          rag-observe report
          tests/fixtures/toy_runs/unsupported_answer.json
          --output /tmp/unsupported_answer.md
