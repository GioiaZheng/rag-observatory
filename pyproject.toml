[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-observatory"
version = "0.1.0"
description = "Trace-based observability and error analysis for Retrieval-Augmented Generation runs."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Gioia Zheng", email = "gioia.zheng.stud@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["rag", "observability", "evaluation", "failure-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/GioiaZheng/rag-observatory"
Repository = "https://github.com/GioiaZheng/rag-observatory"
Issues = "https://github.com/GioiaZheng/rag-observatory/issues"
Changelog = "https://github.com/GioiaZheng/rag-observatory/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "mypy==2.3.0",
    "pre-commit==4.6.2",
    "ruff==0.16.3",
]

[project.scripts]
rag-observe = "rag_observatory.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
