[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-observatory"
version = "0.1.0"
description = "Trace-based observability and error analysis for Retrieval-Augmented Generation runs."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Gioia Zheng", email = "gioia.zheng.stud@gmail.com" }]
license = { file = "LICENSE" }
keywords = ["rag", "observability", "evaluation", "failure-analysis"]
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy==2.1.0",
    "pre-commit==4.6.0",
    "ruff==0.15.20",
]

[project.scripts]
rag-observe = "rag_observatory.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
